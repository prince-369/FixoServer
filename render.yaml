services:
  - type: web
    name: fixo-server
    runtime: node
    plan: starter
    autoDeploy: true
    healthCheckPath: /api/health
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      # Structured-logger threshold. `warn` is already the production default; set here
      # explicitly so debug/info noise stays suppressed and the level is auditable.
      - key: LOG_LEVEL
        value: warn
      - key: TRUST_PROXY
        value: "true"
      - key: CLIENT_URL
        sync: false
      - key: CLIENT_URLS
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # Redis stays configured (dashboard secret) for distributed rate limiting.
      - key: REDIS_URL
        sync: false
      # Single-instance deployment → Socket.IO Redis adapter DISABLED (in-memory rooms).
      # Rate-limit Redis is UNAFFECTED by this flag. Before scaling instances above 1:
      # set this to "true", confirm a shared REDIS_URL, add sticky sessions if polling
      # transport stays on, validate cross-instance events, keep Redis rate limiting on.
      - key: SOCKET_REDIS_ENABLED
        value: "false"
      - key: WEB_PUSH_ENABLED
        value: "true"
      - key: WEB_PUSH_PUBLIC_KEY
        sync: false
      - key: WEB_PUSH_PRIVATE_KEY
        sync: false
      - key: WEB_PUSH_SUBJECT
        sync: false
