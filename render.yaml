services:
  - type: web
    name: fixo-server
    runtime: node
    plan: starter
    autoDeploy: true
    healthCheckPath: /api/health
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      # Structured-logger threshold. `warn` is already the production default; set here
      # explicitly so debug/info noise stays suppressed and the level is auditable.
      - key: LOG_LEVEL
        value: warn
      - key: TRUST_PROXY
        value: "true"
      - key: CLIENT_URL
        sync: false
      - key: CLIENT_URLS
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Persistent auth. Session lifetime comes from the rotating refresh token,
      # never from a long access-token TTL. See docs/AUTH.md.
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL
        value: 30d
      # Distinct from JWT_SECRET so a DB dump alone cannot pre-compute token hashes.
      - key: REFRESH_TOKEN_HASH_SECRET
        generateValue: true
      - key: REFRESH_COOKIE_NAME
        value: fixo_rt
      - key: REFRESH_COOKIE_PATH
        value: /api/auth
      # Empty in proxy mode; set to ".fixoservice.in" when moving to custom domains.
      - key: REFRESH_COOKIE_DOMAIN
        sync: false
      - key: REFRESH_COOKIE_SAMESITE
        value: lax
      - key: REFRESH_COOKIE_SECURE
        value: "true"
      - key: MAX_SESSIONS_PER_USER
        value: "10"
      - key: REFRESH_RATE_LIMIT_MAX
        value: "60"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # Redis stays configured (dashboard secret) for distributed rate limiting.
      - key: REDIS_URL
        sync: false
      # Single-instance deployment → Socket.IO Redis adapter DISABLED (in-memory rooms).
      # Rate-limit Redis is UNAFFECTED by this flag. Before scaling instances above 1:
      # set this to "true", confirm a shared REDIS_URL, add sticky sessions if polling
      # transport stays on, validate cross-instance events, keep Redis rate limiting on.
      - key: SOCKET_REDIS_ENABLED
        value: "false"
      - key: WEB_PUSH_ENABLED
        value: "true"
      - key: WEB_PUSH_PUBLIC_KEY
        sync: false
      - key: WEB_PUSH_PRIVATE_KEY
        sync: false
      - key: WEB_PUSH_SUBJECT
        sync: false
